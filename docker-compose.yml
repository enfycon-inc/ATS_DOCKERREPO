services:


  # ─── 2. Redis Message Broker & Queue ──────────────────────────────────
  redis:
    image: redis:alpine
    container_name: ats_redis_dev
    ports:
      - "6379:6379"
    restart: always

  # ─── 4. FastAPI Resume Parser Microservice ────────────────────────────
  api:
    build: ./resume-parser-main
    container_name: ats_parser_dev
    ports:
      - "8000:8000"
    env_file:
      - ./resume-parser-main/.env
    environment:
      - DATABASE_URL=postgresql://ats_user:AtsDevPass2024@13.55.100.200:5432/ats_db
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    volumes:
      - ./resume-parser-main:/app
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    depends_on:
      redis:
        condition: service_started
    restart: always

  # ─── 5. Celery Background Worker ──────────────────────────────────────
  worker:
    build: ./resume-parser-main
    container_name: ats_worker_dev
    command: celery -A app.celery_app worker --loglevel=info
    env_file:
      - ./resume-parser-main/.env
    environment:
      - DATABASE_URL=postgresql://ats_user:AtsDevPass2024@13.55.100.200:5432/ats_db
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    volumes:
      - ./resume-parser-main:/app
    depends_on:
      redis:
        condition: service_started
      api:
        condition: service_started
    restart: always

  # ─── 6. NestJS Backend (ATS Core API) ────────────────────────────────
  backend:
    build: ./ats_backend
    container_name: ats_backend_dev
    ports:
      - "5000:5000"
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql://ats_user:${POSTGRES_PASSWORD:-AtsDevPass2024}@13.55.100.200:5432/ats_db?schema=ats&options=-csearch_path%3Dats,mass_mail,public}
      - KEYCLOAK_ISSUER=${KEYCLOAK_ISSUER:-https://auth.enfyjobs.com/realms/enfycon-ats}
    env_file:
      - ./ats_backend/.env
    volumes:
      - ./ats_backend:/app
      - /app/node_modules
    depends_on:
      redis:
        condition: service_started
      api:
        condition: service_started
    restart: always

volumes:
  postgres_data:


