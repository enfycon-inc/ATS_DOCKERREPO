<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="760" viewBox="0 0 1600 760" role="img" aria-labelledby="title desc">
  <title id="title">Submission table design preview</title>
  <desc id="desc">EnfySync submissions table with readable account manager and recruiter emails, compact job type badges, short submission progress, and client terms labeled by type.</desc>
