    <style>
      .ui{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#172033}.muted{fill:#64748b}.small{font-size:12px}.body{font-size:13px}.head{font-size:12px;font-weight:700;letter-spacing:.6px;fill:#52617a}.name{font-size:13px;font-weight:650}.email{font-size:11px;fill:#526b92}.value{font-size:12px;font-weight:600}.label{font-size:10px;font-weight:700;letter-spacing:.4px;fill:#6b7280}
