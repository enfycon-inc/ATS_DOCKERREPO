name: ATS CI/CD - blue green production
run-name: ${{ github.event.client_payload.commit || github.event.head_commit.message || format('{0} {1}', inputs.operation, inputs.service) }}
on:
  push:
    branches: [main]
  repository_dispatch:
    types: [microservice-updated]
  workflow_dispatch:
    inputs:
      operation:
        description: Production operation
        type: choice
        options: [deploy, rollback, bootstrap, status, cleanup]
        default: deploy
      service:
        description: Service to build or retry
        type: choice
        options: [all, frontend, backend, parser]
        default: all
      existing_release:
        description: Optional already-built gha-RUN-ATTEMPT tag (production readiness checks still run)
        type: string
        default: ''
      rollback_target:
        description: Retained release ID; blank selects previous release
        type: string
        default: ''
      office_evidence:
        description: Backend-wide office evidence and presence collection
        type: choice
        options: [unchanged, enabled, disabled]
        default: unchanged
concurrency:
  group: production-deployment
  cancel-in-progress: false
permissions:
  contents: read
  packages: write
jobs:
  verify:
    name: Test deployment and rollback controller
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: prisma
          POSTGRES_PASSWORD: prisma
          POSTGRES_DB: ats_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U prisma -d ats_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    outputs:
      build_backend: ${{ steps.changes.outputs.backend }}
      build_frontend: ${{ steps.changes.outputs.frontend }}
      build_parser: ${{ steps.changes.outputs.parser }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check out backend migration fixtures
        uses: actions/checkout@v4
        with:
          repository: enfycon-inc/ats_backend
          path: ats_backend
          ref: ${{ github.event.client_payload.repo == 'enfycon-inc/ats_backend' && github.event.client_payload.ref || 'main' }}
          token: ${{ secrets.GH_PAT }}
      - name: Verify migration fixture is available
        run: test -f ats_backend/prisma/migrations/20261008050000_client_visibility_policy/migration.sql
      - name: Verify Delivery Head assignment migration fixture is available
        run: |
          test -f ats_backend/prisma/migrations/20261021050000_delivery_head_assignment_reason_optional/migration.sql || {
            echo '::error::Backend migration fixture 20261021050000_delivery_head_assignment_reason_optional is missing from the checked-out ref.'
            exit 1
          }
      - name: Verify submission resume migration fixture is available
        run: |
          test -f ats_backend/prisma/migrations/20261023090000_submission_resume_download/migration.sql || {
            echo '::error::Backend migration fixture 20261023090000_submission_resume_download is missing from the checked-out ref.'
            exit 1
          }
      - name: Verify unit geofences migration fixture is available
        run: |
          test -f ats_backend/prisma/migrations/20261026170000_unit_geofences/migration.sql || {
            echo '::error::Backend migration fixture 20261026170000_unit_geofences is missing from the checked-out ref.'
            exit 1
          }
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: ats_backend/package-lock.json
      - name: Verify migration history matches the Prisma schema
        working-directory: ats_backend
        env:
          DATABASE_URL: postgresql://prisma:prisma@localhost:5432/ats_ci?schema=ats
          SHADOW_DATABASE_URL: postgresql://prisma:prisma@localhost:5432/ats_shadow?schema=ats
          PGPASSWORD: prisma
        run: |
          npm ci
          createdb -h localhost -U prisma ats_shadow
          npx prisma validate --schema prisma/schema.prisma
          npx prisma migrate diff \
            --from-migrations prisma/migrations \
            --to-schema-datamodel prisma/schema.prisma \
            --shadow-database-url "$SHADOW_DATABASE_URL" \
            --exit-code
      - run: python3 deployment/bluegreen/test_release.py
      - run: python3 -m py_compile deployment/bluegreen/release.py
      - name: Detect modified services on push
        id: changes
        run: |
          if [ "${{ github.event_name }}" != "push" ]; then
            echo "backend=true" >> "$GITHUB_OUTPUT"
            echo "frontend=true" >> "$GITHUB_OUTPUT"
            echo "parser=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          BEFORE="${{ github.event.before }}"
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] || ! git rev-parse --verify "$BEFORE" >/dev/null 2>&1; then
            DIFF_TARGET="HEAD~1"
          else
            DIFF_TARGET="$BEFORE..${{ github.event.after }}"
          fi

          CHANGED_FILES=$(git diff --name-only $DIFF_TARGET 2>/dev/null || git show --pretty="" --name-only HEAD)
          echo "=== Changed files in push ==="
          echo "$CHANGED_FILES"

          BUILD_BACKEND=false
          BUILD_FRONTEND=false
          BUILD_PARSER=false

          while IFS= read -r file; do
            case "$file" in
              ats_backend/*|deployment/production/compose.yml|deployment/production/init-schemas.sql)
                BUILD_BACKEND=true
                ;;
              ats_frontend_main/*)
                BUILD_FRONTEND=true
                ;;
              resume-parser-main/*|deployment/production/Dockerfile.parser|deployment/production/parser-*)
                BUILD_PARSER=true
                ;;
            esac
          done <<< "$CHANGED_FILES"

          if [ "$BUILD_BACKEND" = false ] && [ "$BUILD_FRONTEND" = false ] && [ "$BUILD_PARSER" = false ]; then
            echo "No service-specific files modified. Defaulting to backend and frontend."
            BUILD_BACKEND=true
            BUILD_FRONTEND=true
          fi

          echo "Detected service build flags:"
          echo "  backend: $BUILD_BACKEND"
          echo "  frontend: $BUILD_FRONTEND"
          echo "  parser: $BUILD_PARSER"

          echo "backend=$BUILD_BACKEND" >> "$GITHUB_OUTPUT"
          echo "frontend=$BUILD_FRONTEND" >> "$GITHUB_OUTPUT"
          echo "parser=$BUILD_PARSER" >> "$GITHUB_OUTPUT"
  build:
    name: Build ${{ matrix.tag }}
    needs: verify
    if: github.ref == 'refs/heads/main' && (!inputs.operation || inputs.operation == 'deploy') && !inputs.existing_release
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - repo: enfycon-inc/ats_backend
            path: ats_backend
            tag: ats-backend
            service: backend
          - repo: enfycon-inc/ats_frontend_main
            path: ats_frontend_main
            tag: ats-frontend
            service: frontend
          - repo: enfycon-inc/resume-parser
            path: resume-parser-main
            tag: ats-parser
            service: parser
    steps:
      - name: Select changed service
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_REPO: ${{ github.event.client_payload.repo }}
          MATRIX_REPO: ${{ matrix.repo }}
          MATRIX_SERVICE: ${{ matrix.service }}
          SERVICE: ${{ inputs.service || 'all' }}
          BUILD_BACKEND: ${{ needs.verify.outputs.build_backend }}
          BUILD_FRONTEND: ${{ needs.verify.outputs.build_frontend }}
          BUILD_PARSER: ${{ needs.verify.outputs.build_parser }}
        run: |
          if [ "$EVENT_NAME" = repository_dispatch ] && [ "$DISPATCH_REPO" != "$MATRIX_REPO" ]; then
            echo 'skip=true' >> "$GITHUB_ENV"
          elif [ "$EVENT_NAME" = workflow_dispatch ] && [ "$SERVICE" != all ] && [ "$SERVICE" != "$MATRIX_SERVICE" ]; then
            echo 'skip=true' >> "$GITHUB_ENV"
          elif [ "$EVENT_NAME" = push ]; then
            if [ "$MATRIX_SERVICE" = backend ] && [ "$BUILD_BACKEND" != true ]; then
              echo 'skip=true' >> "$GITHUB_ENV"
            elif [ "$MATRIX_SERVICE" = frontend ] && [ "$BUILD_FRONTEND" != true ]; then
              echo 'skip=true' >> "$GITHUB_ENV"
            elif [ "$MATRIX_SERVICE" = parser ] && [ "$BUILD_PARSER" != true ]; then
              echo 'skip=true' >> "$GITHUB_ENV"
            fi
          fi
      - uses: actions/checkout@v4
        if: env.skip != 'true'
        with:
          repository: ${{ matrix.repo }}
          path: ${{ matrix.path }}
          ref: ${{ github.event.client_payload.repo == matrix.repo && github.event.client_payload.ref || 'main' }}
          token: ${{ secrets.GH_PAT }}
      - uses: actions/checkout@v4
        if: env.skip != 'true'
        with:
          path: orchestrator
      - uses: actions/setup-node@v4
        if: env.skip != 'true' && matrix.service != 'parser'
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: ${{ matrix.path }}/package-lock.json
      - name: Backend unit and type checks
        if: env.skip != 'true' && matrix.service == 'backend'
        working-directory: ${{ matrix.path }}
        run: |
          npm ci
          npx prisma generate
          # npm test -- --runInBand
          npm run build
      - name: Report pending database cleanup
        if: env.skip != 'true' && matrix.service == 'backend'
        run: python3 orchestrator/deployment/bluegreen/check_schema_cleanups.py ats_backend
      - name: Frontend lint and type checks
        if: env.skip != 'true' && matrix.service == 'frontend'
        working-directory: ${{ matrix.path }}
        run: |
          npm ci --legacy-peer-deps
          # npm run lint
          # npx tsc --noEmit --incremental false
      - name: Parser syntax checks
        if: env.skip != 'true' && matrix.service == 'parser'
        working-directory: ${{ matrix.path }}
        run: python3 -m compileall -q app main.py
      - name: Check out canonical frontend contracts
        if: env.skip != 'true' && matrix.service == 'frontend'
        uses: actions/checkout@v4
        with:
          repository: enfycon-inc/ats_backend
          path: ats_backend
          ref: main
          token: ${{ secrets.GH_PAT }}
      - name: Verify frontend contracts against backend revision
        if: env.skip != 'true' && matrix.service == 'frontend'
        working-directory: ${{ matrix.path }}
        run: |
          echo "Canonical backend revision: $(git -C ../ats_backend rev-parse HEAD)"
          node scripts/sync-tenant-branding.cjs --check-backend
          node scripts/sync-sign-in-policy.cjs --check-backend
          node scripts/sync-job-access.cjs --check-backend
          node scripts/sync-notification-preferences.cjs --check-backend
          node scripts/sync-user-management-contract.cjs --check-backend
          node scripts/sync-submission-auto-approval.cjs --check-backend
          node --test tests/contract-validation.test.cjs
      - name: Record source revision
        if: env.skip != 'true'
        id: source
        working-directory: ${{ matrix.path }}
        run: echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: jlumbroso/free-disk-space@main
        if: env.skip != 'true' && matrix.service == 'parser'
        with:
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false
      - uses: docker/setup-buildx-action@v3
        if: env.skip != 'true'
      - uses: docker/login-action@v3
        if: env.skip != 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build immutable release image
        if: env.skip != 'true'
        id: image
        uses: docker/build-push-action@v5
        with:
          context: ./${{ matrix.path }}
          file: ${{ matrix.service == 'parser' && 'orchestrator/deployment/production/Dockerfile.parser' || format('{0}/Dockerfile.prod', matrix.path) }}
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/${{ matrix.tag }}:gha-${{ github.run_id }}-${{ github.run_attempt }}
          labels: org.opencontainers.image.revision=${{ steps.source.outputs.revision }}
          build-args: |
            NEXT_PUBLIC_API_URL=https://api.enfyjobs.com
            NEXT_PUBLIC_APP_NAME=${{ vars.NEXT_PUBLIC_APP_NAME }}
            NEXT_PUBLIC_COMPANY_NAME=${{ vars.NEXT_PUBLIC_COMPANY_NAME }}
            NEXT_PUBLIC_COMPANY_WEBSITE=${{ vars.NEXT_PUBLIC_COMPANY_WEBSITE }}
            NEXT_DEPLOYMENT_ID=${{ steps.source.outputs.revision }}
          cache-from: type=gha,scope=${{ matrix.tag }}
          cache-to: type=gha,mode=max,scope=${{ matrix.tag }}
      - name: Record built image
        if: env.skip != 'true'
        env:
          SERVICE: ${{ matrix.service }}
          IMAGE_REF: ghcr.io/${{ github.repository_owner }}/${{ matrix.tag }}@${{ steps.image.outputs.digest }}
        run: python3 -c 'import json,os;open("image.json","w").write(json.dumps({os.environ["SERVICE"]:os.environ["IMAGE_REF"]}))'
      - uses: actions/upload-artifact@v4
        if: env.skip != 'true'
        with:
          name: built-${{ matrix.service }}
          path: image.json
  release:
    name: Verify and activate production release
    needs: [verify, build]
    if: always() && !cancelled() && needs.verify.result == 'success' && (needs.build.result == 'success' || (needs.build.result == 'skipped' && (inputs.existing_release || (inputs.operation && inputs.operation != 'deploy'))))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        if: needs.build.result == 'success'
        with:
          pattern: built-*
          path: built
      - uses: docker/login-action@v3
        if: ${{ !inputs.operation || inputs.operation == 'deploy' }}
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Prepare built release and controller
        env:
          OPERATION: ${{ inputs.operation || 'deploy' }}
          SERVICE: ${{ inputs.service || 'all' }}
          EXISTING_RELEASE: ${{ inputs.existing_release }}
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_REPO: ${{ github.event.client_payload.repo }}
          IMAGE_OWNER: ${{ github.repository_owner }}
          VPS_HOST_FINGERPRINT: ${{ vars.VPS_HOST_FINGERPRINT }}
        run: python3 deployment/bluegreen/prepare.py
      - name: Execute blue green deployment or rollback
        uses: appleboy/ssh-action@v1.2.0
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_ACTOR: ${{ github.actor }}
          IMAGE_OWNER: ${{ github.repository_owner }}
          OPERATION: ${{ inputs.operation || 'deploy' }}
          RELEASE_ID: gha-${{ github.run_id }}-${{ github.run_attempt }}
          ROLLBACK_TARGET: ${{ inputs.rollback_target }}
          OFFICE_EVIDENCE_MODE: ${{ inputs.office_evidence || 'unchanged' }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER || 'ubuntu' }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          fingerprint: ${{ vars.VPS_HOST_FINGERPRINT }}
          command_timeout: 30m
          envs: GH_TOKEN,GH_ACTOR,IMAGE_OWNER,OPERATION,RELEASE_ID,ROLLBACK_TARGET,OFFICE_EVIDENCE_MODE,DEPLOY_IMAGES,CONTROLLER_B64
          script_path: deployment/bluegreen/execute.sh
      - name: Record outcome
        if: always()
        env:
          RESULT: ${{ job.status }}
        run: echo "Release result - $RESULT. VPS activation requires running-image and public-route verification." >> "$GITHUB_STEP_SUMMARY"
