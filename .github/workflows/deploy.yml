name: CI/CD Production Deployment to AWS VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  # ─── 1. Build Verification & Typechecks ────────────────────────────
  verify:
    name: Verify Builds & Type Checking
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            ats_backend/package-lock.json
            ats_frontend_main/package-lock.json

      - name: Verify Backend Build
        run: |
          cd ats_backend
          npm ci --legacy-peer-deps
          npm run build

      - name: Verify Frontend Build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NEXT_PUBLIC_API_URL: https://api.enfyjobs.com
        run: |
          cd ats_frontend_main
          npm ci --legacy-peer-deps
          npm run build

  # ─── 2. Deploy to AWS VPS via SSH ──────────────────────────────────
  deploy:
    name: Deploy to AWS VPS
    needs: verify
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Deploy via SSH to AWS VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script_stop: true
          command_timeout: 30m
          script: |
            echo "🚀 Starting ATS Deployment on AWS VPS..."

            # 1. Ensure project directory exists
            APP_DIR="/var/www/ats"
            sudo mkdir -p $APP_DIR
            sudo chown -R $USER:$USER $APP_DIR
            cd $APP_DIR

            # 2. Clone or update root orchestrator repository
            if [ ! -d ".git" ]; then
              echo "📥 Cloning ATS_DOCKERREPO..."
              git clone https://github.com/enfycon-inc/ATS_DOCKERREPO.git .
            else
              echo "🔄 Pulling latest ATS_DOCKERREPO changes..."
              git fetch origin main
              git reset --hard origin/main
            fi

            # 3. Pull / clone microservices
            for repo in ats_frontend_main ats_backend resume-parser-main; do
              if [ ! -d "$repo/.git" ]; then
                echo "📥 Cloning $repo..."
                git clone https://github.com/enfycon-inc/$repo.git $repo 2>/dev/null || \
                git clone https://github.com/enfycon-inc/resume-parser.git $repo
              else
                echo "🔄 Updating $repo..."
                cd $repo
                git fetch origin main
                git reset --hard origin/main
                cd ..
              fi
            done

            # 4. Inject Production Secrets if provided
            if [ -n "${{ secrets.PROD_ENV_BACKEND }}" ]; then
              echo "${{ secrets.PROD_ENV_BACKEND }}" > ats_backend/.env
            fi
            if [ -n "${{ secrets.PROD_ENV_FRONTEND }}" ]; then
              echo "${{ secrets.PROD_ENV_FRONTEND }}" > ats_frontend_main/.env
            fi
            if [ -n "${{ secrets.PROD_ENV_PARSER }}" ]; then
              echo "${{ secrets.PROD_ENV_PARSER }}" > resume-parser-main/.env
            fi

            # 5. Build and launch Docker Compose Production stack
            echo "🐳 Building & restarting production Docker containers..."
            docker compose -f docker-compose.prod.yml up -d --build --remove-orphans

            # 6. Clean up dangling builder cache
            docker image prune -f

            # 7. Health Check
            echo "🩺 Running container health checks..."
            sleep 10
            docker compose -f docker-compose.prod.yml ps

            echo "✅ Deployment completed successfully on AWS VPS!"
