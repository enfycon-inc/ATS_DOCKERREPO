name: CI/CD Production Deployment to AWS VPS
run-name: ${{ github.event.client_payload.commit || github.event.head_commit.message || 'Manual deployment' }}

on:
  push:
    branches:
      - main
  repository_dispatch:
    types: [microservice-updated]
  workflow_dispatch:
    inputs:
      check_only:
        description: Test VPS connection without building or deploying
        type: boolean
        default: false
      service:
        description: Service to deploy
        type: choice
        options: [all, frontend, backend, parser]
        default: all
      existing_release:
        description: Optional existing GHCR release tag (gha-RUN-ATTEMPT); skips rebuilding
        type: string
        default: ''

concurrency:
  group: production-deployment
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  verify:
    name: Verify Current VPS
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Orchestrator Code
        uses: actions/checkout@v4

      - name: Test deployment failure and completion handling
        run: python3 deployment/github/test-deploy.py

      - name: Check SSH connection and current installation
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER || 'ubuntu' }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            set -e
            cd /var/www/ats-prod
            test -f compose.yml
            test -f .env
            test -f backup.sh
            sudo -n docker info >/dev/null
            sudo -n docker compose -f compose.yml config --quiet
            echo 'Current VPS installation verified'

  build:
    name: Build & Push ${{ matrix.tag }}
    needs: verify
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && !inputs.check_only && !inputs.existing_release
    strategy:
      fail-fast: false
      matrix:
        include:
          - repo: enfycon-inc/ats_backend
            path: ats_backend
            dockerfile: Dockerfile.prod
            tag: ats-backend
          - repo: enfycon-inc/ats_frontend_main
            path: ats_frontend_main
            dockerfile: Dockerfile.prod
            tag: ats-frontend
          - repo: enfycon-inc/resume-parser
            path: resume-parser-main
            dockerfile: Dockerfile
            tag: ats-parser
    steps:
      - name: Check if matrix job should run
        id: check
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_REPO: ${{ github.event.client_payload.repo }}
          MATRIX_REPO: ${{ matrix.repo }}
          MATRIX_TAG: ${{ matrix.tag }}
          SERVICE: ${{ inputs.service || 'all' }}
        run: |
          if [ "$EVENT_NAME" = "repository_dispatch" ] && [ "$DISPATCH_REPO" != "$MATRIX_REPO" ]; then
            echo "skip=true" >> $GITHUB_ENV
          elif [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$SERVICE" != "all" ] && [ "ats-$SERVICE" != "$MATRIX_TAG" ]; then
            echo "skip=true" >> $GITHUB_ENV
          fi

      - name: Free Disk Space (Ubuntu)
        if: matrix.tag == 'ats-parser' && env.skip != 'true'
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false

      - name: Checkout Microservice
        if: env.skip != 'true'
        uses: actions/checkout@v4
        with:
          repository: ${{ matrix.repo }}
          path: ${{ matrix.path }}
          ref: ${{ github.event.client_payload.repo == matrix.repo && github.event.client_payload.ref || 'main' }}
          token: ${{ secrets.GH_PAT }}

      - name: Checkout Deployment Configuration
        if: env.skip != 'true'
        uses: actions/checkout@v4
        with:
          path: orchestrator

      - name: Record source revision
        if: env.skip != 'true'
        id: source
        working-directory: ${{ matrix.path }}
        run: echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        if: env.skip != 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: env.skip != 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Image
        if: env.skip != 'true'
        uses: docker/build-push-action@v5
        with:
          context: ./${{ matrix.path }}
          file: ${{ matrix.tag == 'ats-parser' && 'orchestrator/deployment/production/Dockerfile.parser' || format('./{0}/{1}', matrix.path, matrix.dockerfile) }}
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/${{ matrix.tag }}:gha-${{ github.run_id }}-${{ github.run_attempt }}
          build-args: NEXT_PUBLIC_API_URL=https://api.enfyjobs.com
          labels: org.opencontainers.image.revision=${{ steps.source.outputs.revision }}
          cache-from: type=gha,scope=${{ matrix.tag }}
          cache-to: type=gha,mode=max,scope=${{ matrix.tag }}

  deploy:
    name: Deploy to Current Production VPS
    needs: [verify, build]
    if: always() && !cancelled() && needs.verify.result == 'success' && !inputs.check_only && (needs.build.result == 'success' || (inputs.existing_release && needs.build.result == 'skipped'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pull built images and restart current VPS application services
        uses: appleboy/ssh-action@v1.2.0
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_ACTOR: ${{ github.actor }}
          IMAGE_OWNER: ${{ github.repository_owner }}
          RELEASE_TAG: ${{ inputs.existing_release || format('gha-{0}-{1}', github.run_id, github.run_attempt) }}
          SERVICE: ${{ inputs.service || 'all' }}
          DISPATCH_REPO: ${{ github.event.client_payload.repo }}
          EVENT_NAME: ${{ github.event_name }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER || 'ubuntu' }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          command_timeout: 30m
          envs: GH_TOKEN,GH_ACTOR,IMAGE_OWNER,RELEASE_TAG,DISPATCH_REPO,EVENT_NAME,SERVICE
          script_path: deployment/github/deploy-current-vps.sh
