name: CI/CD Production Deployment to AWS VPS
run-name: ${{ github.event.client_payload.commit || github.event.head_commit.message || 'Manual deployment' }}

on:
  push:
    branches:
      - main
  repository_dispatch:
    types: [microservice-updated]
  workflow_dispatch:

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  # ─── 1. Verify Configuration & Compose Integrity ────────────────────
  verify:
    name: Verify Docker & Config Integrity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Orchestrator Code
        uses: actions/checkout@v4

      - name: Validate Docker Compose Configuration
        run: |
          echo "📁 Creating placeholder directories for build contexts..."
          mkdir -p ats_frontend_main ats_backend resume-parser-main keycloak/import caddy_upstreams
          touch ats_frontend_main/.env ats_backend/.env resume-parser-main/.env
          
          echo "🔍 Validating docker-compose.prod.yml syntax..."
          docker compose -f docker-compose.prod.yml config

      - name: Validate Caddyfile Syntax
        run: |
          echo "🔍 Validating Caddyfile..."
          docker run --rm \
            -v ${{ github.workspace }}/Caddyfile:/etc/caddy/Caddyfile \
            -v ${{ github.workspace }}/caddy_upstreams:/etc/caddy/upstreams \
            caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile

  # ─── 2. Deploy to Production VPS via SSH ────────────────────────────
  deploy:
    name: Deploy to Production AWS VPS
    needs: verify
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Deploy to VPS with Zero-Downtime Blue/Green Switch
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER || 'ubuntu' }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script_stop: true
          command_timeout: 30m
          script: |
            unset INPUT_SCRIPT INPUT_KEY INPUT_PROXY_KEY

            echo "=========================================================="
            echo "🚀 Starting ATS Zero-Downtime Deployment on AWS VPS"
            echo "📌 Trigger Source: ${{ github.event.client_payload.repo || github.repository }}"
            echo "📝 Commit Message: ${{ github.event.client_payload.commit || github.event.head_commit.message || 'Automated Sync' }}"
            echo "👤 Triggered By: ${{ github.event.client_payload.author || github.actor }}"
            echo "=========================================================="

            APP_DIR="/var/www/ats"
            mkdir -p "$APP_DIR"
            cd "$APP_DIR"

            # 1. Trust GitHub host
            mkdir -p ~/.ssh
            ssh-keyscan -H github.com >> ~/.ssh/known_hosts 2>/dev/null || true

            # 2. Sync Orchestrator Repository
            echo "📦 Syncing ATS_DOCKERREPO..."
            test -d .git || git clone git@github.com:enfycon-inc/ATS_DOCKERREPO.git .
            git remote set-url origin git@github.com:enfycon-inc/ATS_DOCKERREPO.git || true
            git fetch origin main || true
            git reset --hard origin/main

            # 3. Ensure deployment script has execution permissions and run it
            chmod +x scripts/zero_downtime_deploy.sh
            bash scripts/zero_downtime_deploy.sh
