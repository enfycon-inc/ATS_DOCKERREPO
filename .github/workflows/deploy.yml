name: CI/CD Production Deployment to AWS VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  # ─── 1. Verify Compose & Config Integrity ─────────────────────────
  verify:
    name: Verify Docker & Config Integrity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Orchestrator Code
        uses: actions/checkout@v4

      - name: Validate Docker Compose Configuration
        run: |
          echo "📁 Creating placeholder directories for build contexts..."
          mkdir -p ats_frontend_main ats_backend resume-parser-main keycloak/import
          touch ats_frontend_main/.env ats_backend/.env resume-parser-main/.env
          
          echo "🔍 Validating docker-compose.prod.yml syntax..."
          docker compose -f docker-compose.prod.yml config

      - name: Validate Caddyfile Syntax
        run: |
          echo "🔍 Validating Caddyfile..."
          docker run --rm -v ${{ github.workspace }}/Caddyfile:/etc/caddy/Caddyfile caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile

  # ─── 2. Deploy to AWS VPS via Native OpenSSH ───────────────────────
  deploy:
    name: Deploy to AWS VPS
    needs: verify
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Execute Remote Deployment via SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USERNAME: ${{ secrets.VPS_USERNAME }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
        run: |
          if [ -z "$VPS_HOST" ] || [ -z "$VPS_SSH_KEY" ]; then
            echo "❌ Error: Missing required GitHub Secrets (VPS_HOST or VPS_SSH_KEY)."
            echo "👉 Please set VPS_HOST and VPS_SSH_KEY in GitHub Repo Settings > Secrets and variables > Actions"
            exit 1
          fi

          echo "🔑 Preparing SSH key with Python decoder..."
          mkdir -p ~/.ssh

          python3 - << 'PY_EOF'
          import os, sys, base64

          raw_key = os.environ.get("VPS_SSH_KEY", "").strip()
          if not raw_key:
              print("❌ VPS_SSH_KEY is empty!")
              sys.exit(1)

          key_path = os.path.expanduser("~/.ssh/deploy_key")

          if "-----BEGIN" in raw_key:
              print("📄 Detected raw OpenSSH / PEM key format.")
              clean = raw_key.replace("\\n", "\n").replace("\r", "").strip() + "\n"
              with open(key_path, "w", encoding="utf-8", newline="\n") as f:
                  f.write(clean)
          else:
              print("🔐 Detected Base64-encoded key format. Decoding...")
              try:
                  decoded = base64.b64decode(raw_key)
                  with open(key_path, "wb") as f:
                      f.write(decoded.strip() + b"\n")
              except Exception as err:
                  print(f"❌ Failed to decode base64 key: {err}")
                  sys.exit(1)

          os.chmod(key_path, 0o600)
          print("✓ SSH private key written successfully.")
          PY_EOF

          # Auto-derive corresponding public key
          ssh-keygen -y -f ~/.ssh/deploy_key > ~/.ssh/deploy_key.pub 2>/dev/null || true
          chmod 644 ~/.ssh/deploy_key.pub 2>/dev/null || true

          echo "🚀 Connecting to AWS VPS ($VPS_HOST)..."
          ssh -i ~/.ssh/deploy_key \
              -p ${VPS_PORT:-22} \
              -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null \
              -o IdentitiesOnly=yes \
              -o ConnectTimeout=15 \
              "${VPS_USERNAME:-ubuntu}@$VPS_HOST" bash << 'EOF'
            set -e
            echo "=========================================================="
            echo "🚀 Starting ATS Production Deployment on AWS VPS"
            echo "=========================================================="
            export GIT_TERMINAL_PROMPT=0
            export DOCKER_BUILDKIT=1

            # 1. Ensure GitHub is in known_hosts
            mkdir -p ~/.ssh
            ssh-keyscan -H github.com >> ~/.ssh/known_hosts 2>/dev/null || true

            # 2. Ensure project directory exists
            APP_DIR="/var/www/ats"
            sudo mkdir -p $APP_DIR
            sudo chown -R $USER:$USER $APP_DIR
            cd $APP_DIR

            # 3. Clone or update root orchestrator repository using SSH
            if [ ! -d ".git" ]; then
              echo "📥 Cloning ATS_DOCKERREPO..."
              git clone git@github.com:enfycon-inc/ATS_DOCKERREPO.git .
            else
              echo "🔄 Pulling latest ATS_DOCKERREPO changes..."
              git fetch origin main
              git reset --hard origin/main
            fi

            # 4. Pull / clone microservices via SSH
            for repo_info in "ats_frontend_main:ats_frontend_main" "ats_backend:ats_backend" "resume-parser-main:resume-parser"; do
              IFS=":" read -r local_dir remote_repo <<< "$repo_info"
              if [ ! -d "$local_dir/.git" ]; then
                echo "📥 Cloning $remote_repo into $local_dir..."
                git clone git@github.com:enfycon-inc/$remote_repo.git $local_dir
              else
                echo "🔄 Updating $local_dir..."
                cd $local_dir
                git fetch origin main
                git reset --hard origin/main
                cd ..
              fi
            done

            # 5. Build and launch Docker Compose Production stack
            echo "🐳 Building & restarting production Docker containers..."
            docker compose -f docker-compose.prod.yml up -d --build --remove-orphans

            # 6. Clean up dangling builder cache
            docker image prune -f

            # 7. Health Check
            echo "🩺 Checking container status..."
            sleep 5
            docker compose -f docker-compose.prod.yml ps

            echo "=========================================================="
            echo "✅ Deployment completed successfully on AWS VPS!"
            echo "=========================================================="
          EOF
