name: CI/CD Production Deployment to AWS VPS
run-name: ${{ github.event.client_payload.commit || github.event.head_commit.message || 'Manual deployment' }}

on:
  push:
    branches:
      - main
  repository_dispatch:
    types: [microservice-updated]
  workflow_dispatch:

concurrency:
  group: production-deployment
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  verify:
    name: Verify Config Integrity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Orchestrator Code
        uses: actions/checkout@v4

      - name: Validate Docker Compose Configuration
        run: |
          mkdir -p ats_frontend_main ats_backend resume-parser-main keycloak/import caddy_upstreams
          touch ats_frontend_main/.env ats_backend/.env resume-parser-main/.env
          docker compose -f docker-compose.prod.yml config

  build:
    name: Build & Push ${{ matrix.tag }}
    needs: verify
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        include:
          - repo: enfycon-inc/ats_backend
            path: ats_backend
            dockerfile: Dockerfile.prod
            tag: ats-backend
          - repo: enfycon-inc/ats_frontend_main
            path: ats_frontend_main
            dockerfile: Dockerfile.prod
            tag: ats-frontend
          - repo: enfycon-inc/resume-parser
            path: resume-parser-main
            dockerfile: Dockerfile
            tag: ats-parser
    steps:
      - name: Check if matrix job should run
        id: check
        run: |
          if [ "${{ github.event_name }}" == "repository_dispatch" ] && [ "${{ github.event.client_payload.repo }}" != "${{ matrix.repo }}" ]; then
            echo "skip=true" >> $GITHUB_ENV
          fi

      - name: Free Disk Space (Ubuntu)
        if: matrix.tag == 'ats-parser' && env.skip != 'true'
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false

      - name: Checkout Microservice
        if: env.skip != 'true'
        uses: actions/checkout@v4
        with:
          repository: ${{ matrix.repo }}
          path: ${{ matrix.path }}
          token: ${{ secrets.GH_PAT }}

      - name: Set up Docker Buildx
        if: env.skip != 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: env.skip != 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Image
        if: env.skip != 'true'
        uses: docker/build-push-action@v5
        with:
          context: ./${{ matrix.path }}
          file: ./${{ matrix.path }}/${{ matrix.dockerfile }}
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/${{ matrix.tag }}:latest
          cache-from: type=gha,scope=${{ matrix.tag }}
          cache-to: type=gha,mode=max,scope=${{ matrix.tag }}

  deploy:
    name: Deploy to Production AWS VPS
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS with Zero-Downtime Blue/Green Switch
        uses: appleboy/ssh-action@v1.0.3
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_ACTOR: ${{ github.actor }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER || 'ubuntu' }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script_stop: true
          command_timeout: 30m
          envs: GH_TOKEN,GH_ACTOR
          script: |
            echo "=========================================================="
            echo "?? Starting ATS Zero-Downtime Deployment on AWS VPS"
            echo "=========================================================="

            APP_DIR="/var/www/ats"
            mkdir -p "$APP_DIR"
            cd "$APP_DIR"

            # 1. Trust GitHub host
            mkdir -p ~/.ssh
            ssh-keyscan -H github.com >> ~/.ssh/known_hosts 2>/dev/null || true

            # 2. Sync Orchestrator Repository
            echo "?? Syncing ATS_DOCKERREPO..."
            test -d .git || git clone git@github.com:enfycon-inc/ATS_DOCKERREPO.git .
            git remote set-url origin git@github.com:enfycon-inc/ATS_DOCKERREPO.git || true
            git fetch origin main || true
            git reset --hard origin/main

            # 3. Log in to GHCR to pull images
            echo "?? Logging into GitHub Container Registry..."
            echo "$GH_TOKEN" | docker login ghcr.io -u "$GH_ACTOR" --password-stdin

            # 4. Ensure deployment script has execution permissions and run it
            chmod +x scripts/zero_downtime_deploy.sh
            bash scripts/zero_downtime_deploy.sh
