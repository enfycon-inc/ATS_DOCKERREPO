name: CI/CD Production Deployment to AWS VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  # ─── 1. Verify Compose & Config Integrity ─────────────────────────
  verify:
    name: Verify Docker & Config Integrity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Orchestrator Code
        uses: actions/checkout@v4

      - name: Validate Docker Compose Configuration
        run: |
          echo "📁 Creating placeholder directories for build contexts..."
          mkdir -p ats_frontend_main ats_backend resume-parser-main keycloak/import
          touch ats_frontend_main/.env ats_backend/.env resume-parser-main/.env
          
          echo "🔍 Validating docker-compose.prod.yml syntax..."
          docker compose -f docker-compose.prod.yml config

      - name: Validate Caddyfile Syntax
        run: |
          echo "🔍 Validating Caddyfile..."
          docker run --rm -v ${{ github.workspace }}/Caddyfile:/etc/caddy/Caddyfile caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile

  # ─── 2. Deploy to AWS VPS via SSH ──────────────────────────────────
  deploy:
    name: Deploy to AWS VPS
    needs: verify
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Deploy to VPS with Rollback and Cleanup
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER || secrets.VPS_USERNAME || 'ubuntu' }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script_stop: true
          command_timeout: 30m
          script: |
            unset INPUT_SCRIPT INPUT_KEY INPUT_PROXY_KEY

            dc() {
              env -i PATH="$PATH" HOME="$HOME" USER="$USER" docker compose "$@"
            }

            echo "=========================================================="
            echo "🚀 Starting ATS Production Deployment on AWS VPS"
            echo "=========================================================="
            export GIT_TERMINAL_PROMPT=0
            export DOCKER_BUILDKIT=1

            # 1. Trust GitHub host
            mkdir -p ~/.ssh
            ssh-keyscan -H github.com >> ~/.ssh/known_hosts 2>/dev/null || true

            # 2. Navigate to project directory
            APP_DIR="/var/www/ats"
            mkdir -p "$APP_DIR"
            cd "$APP_DIR"

            # 3. Pull / Clone Root Orchestrator Repository
            echo "📦 Syncing ATS_DOCKERREPO..."
            test -d .git || git clone git@github.com:enfycon-inc/ATS_DOCKERREPO.git .
            git remote set-url origin git@github.com:enfycon-inc/ATS_DOCKERREPO.git || true
            git fetch origin main || true
            git reset --hard origin/main

            # 4. Pull / Clone Microservices
            for repo_info in "ats_frontend_main:ats_frontend_main" "ats_backend:ats_backend" "resume-parser-main:resume-parser"; do
              local_dir="${repo_info%%:*}"
              remote_repo="${repo_info##*:}"
              echo "📦 Syncing $remote_repo into $local_dir..."
              test -d "$local_dir/.git" || git clone "git@github.com:enfycon-inc/$remote_repo.git" "$local_dir"
              cd "$local_dir"
              git remote set-url origin "git@github.com:enfycon-inc/$remote_repo.git" || true
              git fetch origin main || true
              git reset --hard origin/main
              cd "$APP_DIR"
            done

            # 5. Build and launch Docker Compose Production stack
            echo "🐳 Building & restarting production Docker containers..."
            dc -f docker-compose.prod.yml up -d --build --remove-orphans

            # 6. Clean up dangling builder cache
            docker image prune -f || true

            # 7. Health Check and Caddy Logs Inspection
            echo "🩺 Checking container status..."
            sleep 8
            dc -f docker-compose.prod.yml ps

            echo "📋 Recent Caddy Logs (full - including TLS/ACME errors):"
            dc -f docker-compose.prod.yml logs --tail=80 caddy

            echo "🔐 Caddy cert store contents:"
            docker exec ats_caddy find /data/caddy/certificates -type f -name '*.crt' 2>/dev/null | sort || echo "No certs yet"

            echo "🔍 Testing ACME challenge path accessibility:"
            curl -sI http://api.enfyjobs.com/.well-known/acme-challenge/test --max-time 5 | grep -E 'HTTP|Location' || echo "Port 80 check failed"
            curl -sI http://enfyjobs.com/.well-known/acme-challenge/test --max-time 5 | grep -E 'HTTP|Location' || echo "Port 80 check failed"

            echo "🌐 Testing HTTPS connectivity (should show cert info after ACME completes):"
            curl -sk -I https://enfyjobs.com/ --max-time 8 | grep -E 'HTTP|Server' || echo "enfyjobs.com HTTPS check"
            curl -sk -I https://api.enfyjobs.com/ --max-time 8 | grep -E 'HTTP|Server' || echo "api.enfyjobs.com HTTPS check"

            echo "=========================================================="
            echo "✅ Deployment completed successfully on AWS VPS!"
            echo "=========================================================="
