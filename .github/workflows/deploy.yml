name: CI/CD Production Deployment to AWS VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  # ─── 1. Verify Compose & Config Integrity ─────────────────────────
  verify:
    name: Verify Docker & Config Integrity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Orchestrator Code
        uses: actions/checkout@v4

      - name: Validate Docker Compose Configuration
        run: |
          echo "📁 Creating placeholder directories for build contexts..."
          mkdir -p ats_frontend_main ats_backend resume-parser-main keycloak/import
          touch ats_frontend_main/.env ats_backend/.env resume-parser-main/.env
          
          echo "🔍 Validating docker-compose.prod.yml syntax..."
          docker compose -f docker-compose.prod.yml config

      - name: Validate Caddyfile Syntax
        run: |
          echo "🔍 Validating Caddyfile..."
          docker run --rm -v ${{ github.workspace }}/Caddyfile:/etc/caddy/Caddyfile caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile

  # ─── 2. Deploy to AWS VPS via SSH ──────────────────────────────────
  deploy:
    name: Deploy to AWS VPS
    needs: verify
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Deploy to VPS with Rollback and Cleanup
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER || secrets.VPS_USERNAME || 'ubuntu' }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script_stop: true
          command_timeout: 30m
          script: |
            set -e

            # Clean large SSH environment variables to avoid ARG_MAX issues
            unset INPUT_SCRIPT INPUT_KEY INPUT_PROXY_KEY

            dc() {
              env -i PATH="$PATH" HOME="$HOME" USER="$USER" docker compose "$@"
            }

            echo "=========================================================="
            echo "🚀 Starting ATS Production Deployment on AWS VPS"
            echo "=========================================================="
            export GIT_TERMINAL_PROMPT=0
            export DOCKER_BUILDKIT=1

            # 1. Ensure GitHub is in known_hosts
            mkdir -p ~/.ssh
            ssh-keyscan -H github.com >> ~/.ssh/known_hosts 2>/dev/null || true

            # 2. Ensure project directory exists
            APP_DIR="/var/www/ats"
            mkdir -p $APP_DIR
            cd $APP_DIR

            # 3. Clone or update root orchestrator repository using SSH
            if [ ! -d ".git" ]; then
              echo "📥 Cloning ATS_DOCKERREPO..."
              git clone git@github.com:enfycon-inc/ATS_DOCKERREPO.git .
            else
              echo "🔄 Pulling latest ATS_DOCKERREPO changes..."
              git remote set-url origin git@github.com:enfycon-inc/ATS_DOCKERREPO.git || true
              git fetch origin main
              git reset --hard origin/main
            fi

            # 4. Pull / clone microservices via SSH
            for repo_info in "ats_frontend_main:ats_frontend_main" "ats_backend:ats_backend" "resume-parser-main:resume-parser"; do
              IFS=":" read -r local_dir remote_repo <<< "$repo_info"
              if [ ! -d "$local_dir/.git" ]; then
                echo "📥 Cloning $remote_repo into $local_dir..."
                git clone git@github.com:enfycon-inc/$remote_repo.git $local_dir
              else
                echo "🔄 Updating $local_dir..."
                cd $local_dir
                git remote set-url origin git@github.com:enfycon-inc/$remote_repo.git || true
                git fetch origin main
                git reset --hard origin/main
                cd ..
              fi
            done

            # 5. Build and launch Docker Compose Production stack
            echo "🐳 Building & restarting production Docker containers..."
            dc -f docker-compose.prod.yml up -d --build --remove-orphans

            # 6. Clean up dangling builder cache
            docker image prune -f

            # 7. Health Check
            echo "🩺 Checking container status..."
            sleep 5
            dc -f docker-compose.prod.yml ps

            echo "=========================================================="
            echo "✅ Deployment completed successfully on AWS VPS!"
            echo "=========================================================="
