name: CI/CD Production Deployment to AWS VPS
run-name: ${{ github.event.client_payload.commit || github.event.head_commit.message || 'Manual deployment' }}

on:
  push:
    branches:
      - main
  repository_dispatch:
    types: [microservice-updated]
  workflow_dispatch:

concurrency:
  group: production-deployment
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  verify:
    name: Verify Config Integrity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Orchestrator Code
        uses: actions/checkout@v4

      - name: Validate Docker Compose Configuration
        run: |
          mkdir -p ats_frontend_main ats_backend resume-parser-main keycloak/import caddy_upstreams
          touch ats_frontend_main/.env ats_backend/.env resume-parser-main/.env
          docker compose -f docker-compose.prod.yml config

  build:
    name: Build & Push Docker Images
    needs: verify
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false

      - name: Checkout Frontend
        uses: actions/checkout@v4
        with:
          repository: enfycon-inc/ats_frontend_main
          path: ats_frontend_main
          token: ${{ secrets.GH_PAT }}

      - name: Checkout Backend
        uses: actions/checkout@v4
        with:
          repository: enfycon-inc/ats_backend
          path: ats_backend
          token: ${{ secrets.GH_PAT }}

      - name: Checkout Resume Parser
        uses: actions/checkout@v4
        with:
          repository: enfycon-inc/resume-parser
          path: resume-parser-main
          token: ${{ secrets.GH_PAT }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Backend
        uses: docker/build-push-action@v5
        with:
          context: ./ats_backend
          file: ./ats_backend/Dockerfile.prod
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/ats-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and Push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./ats_frontend_main
          file: ./ats_frontend_main/Dockerfile.prod
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/ats-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and Push Parser
        uses: docker/build-push-action@v5
        with:
          context: ./resume-parser-main
          file: ./resume-parser-main/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/ats-parser:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Production AWS VPS
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS with Zero-Downtime Blue/Green Switch
        uses: appleboy/ssh-action@v1.0.3
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_ACTOR: ${{ github.actor }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER || 'ubuntu' }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script_stop: true
          command_timeout: 10m
          envs: GH_TOKEN,GH_ACTOR
          script: |
            echo "=========================================================="
            echo "?? Starting ATS Zero-Downtime Deployment on AWS VPS"
            echo "=========================================================="

            APP_DIR="/var/www/ats"
            mkdir -p "$APP_DIR"
            cd "$APP_DIR"

            # 1. Trust GitHub host
            mkdir -p ~/.ssh
            ssh-keyscan -H github.com >> ~/.ssh/known_hosts 2>/dev/null || true

            # 2. Sync Orchestrator Repository
            echo "?? Syncing ATS_DOCKERREPO..."
            test -d .git || git clone git@github.com:enfycon-inc/ATS_DOCKERREPO.git .
            git remote set-url origin git@github.com:enfycon-inc/ATS_DOCKERREPO.git || true
            git fetch origin main || true
            git reset --hard origin/main

            # 3. Log in to GHCR to pull images
            echo "?? Logging into GitHub Container Registry..."
            echo "$GH_TOKEN" | docker login ghcr.io -u "$GH_ACTOR" --password-stdin

            # 4. Ensure deployment script has execution permissions and run it
            chmod +x scripts/zero_downtime_deploy.sh
            bash scripts/zero_downtime_deploy.sh
