name: Migrate development database

on:
  workflow_dispatch:
    inputs:
      confirm_development_database:
        description: Confirm this run targets the development database configured in DEV_DATABASE_URL
        type: boolean
        required: true
        default: false
      backend_ref:
        description: Branch or commit in enfycon-inc/ats_backend that contains the migration
        type: string
        required: true
        default: main

permissions:
  contents: read

concurrency:
  group: ats-development-database-migrations
  cancel-in-progress: false

jobs:
  migrate:
    name: Preflight and migrate development only
    if: inputs.confirm_development_database == true
    runs-on: ubuntu-latest
    environment: development
    steps:
      - name: Check out ATS backend source
        uses: actions/checkout@v4
        with:
          repository: enfycon-inc/ats_backend
          ref: ${{ inputs.backend_ref }}
          path: ats_backend
          token: ${{ secrets.GH_PAT }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ats_backend/package-lock.json

      - name: Install backend dependencies and generate Prisma client
        working-directory: ats_backend
        env:
          DATABASE_URL: ${{ secrets.DEV_DATABASE_URL }}
        run: |
          test -n "$DATABASE_URL" || { echo 'DEV_DATABASE_URL secret is missing.'; exit 1; }
          npm ci
          npx prisma validate --schema prisma/schema.prisma
          npx prisma generate --schema prisma/schema.prisma

      - name: Verify only the approved development migration is pending
        id: preflight
        working-directory: ats_backend
        env:
          DATABASE_URL: ${{ secrets.DEV_DATABASE_URL }}
        run: |
          node <<'NODE'
          const crypto = require('node:crypto');
          const fs = require('node:fs');
          const path = require('node:path');
          const { PrismaClient } = require('@prisma/client');

          const expectedMigration = '20261028120000_candidate_latest_ctc_units';
          const migrationRoot = path.join(process.cwd(), 'prisma', 'migrations');
          const migrationFiles = fs.readdirSync(migrationRoot, { withFileTypes: true })
            .filter(entry => entry.isDirectory())
            .map(entry => ({ name: entry.name, file: path.join(migrationRoot, entry.name, 'migration.sql') }))
            .filter(entry => fs.existsSync(entry.file))
            .sort((a, b) => a.name.localeCompare(b.name));
          const fileByName = new Map(migrationFiles.map(entry => [entry.name, entry.file]));
          const checksumMatches = (file, expected) => {
            const original = fs.readFileSync(file);
            const lf = Buffer.from(original.toString('utf8').replace(/\r\n/g, '\n'));
            const variants = [original, lf, Buffer.from(lf.toString('utf8').replace(/\n/g, '\r\n'))];
            return variants.some(value => crypto.createHash('sha256').update(value).digest('hex') === expected);
          };

          if (!fileByName.has(expectedMigration)) {
            throw new Error(`Backend ref does not contain ${expectedMigration}.`);
          }

          const prisma = new PrismaClient();
          (async () => {
            try {
              const history = await prisma.$queryRawUnsafe(
                'SELECT migration_name, checksum, started_at, finished_at, rolled_back_at FROM ats._prisma_migrations ORDER BY started_at'
              );
              const failed = history.filter(row => row.started_at && !row.finished_at && !row.rolled_back_at);
              if (failed.length) {
                throw new Error(`Database has unresolved failed migration(s): ${failed.map(row => row.migration_name).join(', ')}`);
              }

              const appliedRows = history.filter(row => row.finished_at && !row.rolled_back_at);
              for (const row of appliedRows) {
                const file = fileByName.get(row.migration_name);
                if (!file || !checksumMatches(file, row.checksum)) {
                  throw new Error(`Applied migration history does not match this backend ref: ${row.migration_name}`);
                }
              }

              const appliedNames = new Set(appliedRows.map(row => row.migration_name));
              const pending = migrationFiles.filter(entry => !appliedNames.has(entry.name)).map(entry => entry.name);
              if (pending.length === 0 && appliedNames.has(expectedMigration)) {
                console.log('The candidate CTC migration is already applied; no changes are needed.');
                fs.appendFileSync(process.env.GITHUB_OUTPUT, 'already_applied=true\n');
                return;
              }
              if (pending.length !== 1 || pending[0] !== expectedMigration) {
                throw new Error(`Refusing to migrate. Expected only ${expectedMigration} to be pending; found: ${pending.join(', ') || 'none'}.`);
              }

              console.log(`Preflight passed. Only ${expectedMigration} is pending.`);
              fs.appendFileSync(process.env.GITHUB_OUTPUT, 'already_applied=false\n');
            } finally {
              await prisma.$disconnect();
            }
          })().catch(error => {
            console.error(error.message);
            process.exitCode = 1;
          });
          NODE

      - name: Apply the approved development migration
        if: steps.preflight.outputs.already_applied != 'true'
        working-directory: ats_backend
        env:
          DATABASE_URL: ${{ secrets.DEV_DATABASE_URL }}
        run: npx prisma migrate deploy --schema prisma/schema.prisma

      - name: Confirm development migration status
        working-directory: ats_backend
        env:
          DATABASE_URL: ${{ secrets.DEV_DATABASE_URL }}
        run: npx prisma migrate status --schema prisma/schema.prisma

      - name: Record safe completion summary
        if: success()
        run: echo 'Development migration preflight and post-check completed. No production database was targeted.' >> "$GITHUB_STEP_SUMMARY"
