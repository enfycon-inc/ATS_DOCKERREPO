services:
  # ─── 0. PostgreSQL — Single DB, 3 schemas (ats, mass_mail, keycloak) ──
  postgres:
    image: postgres:16-alpine
    container_name: ats_postgres
    restart: always
    environment:
      POSTGRES_DB: ats_db
      POSTGRES_USER: ats_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-AtsDevPass2024}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-schemas.sql:/docker-entrypoint-initdb.d/01-init-schemas.sql:ro
      - ./scripts/production_seed_data.sql:/docker-entrypoint-initdb.d/02-seed-data.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ats_user -d ats_db"]
      interval: 4s
      timeout: 4s
      retries: 25
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 768M
        reservations:
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ─── 1. Caddy Reverse Proxy & Automatic SSL Engine ────────────────
  caddy:
    image: caddy:2-alpine
    container_name: ats_caddy
    restart: always
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp" # HTTP/3 Support
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy_upstreams:/etc/caddy/upstreams:ro
      - caddy_data:/data
      - caddy_config:/config
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 128M
        reservations:
          memory: 32M
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

  # ─── 2. Blue Stack: Next.js Frontend Application ──────────────────
  frontend_blue:
    build:
      context: ./ats_frontend_main
      dockerfile: Dockerfile.prod
    container_name: ats_frontend_blue
    restart: always
    expose:
      - "3000"
    env_file:
      - path: ./ats_frontend_main/.env
        required: false
    environment:
      - NODE_ENV=production
      - PORT=3000
      - AUTH_TRUST_HOST=true
      - INTERNAL_API_URL=http://backend_blue:5000
      - NEXT_PUBLIC_API_URL=https://api.enfyjobs.com
      - NEXT_PUBLIC_MAIN_DOMAIN_URL=https://enfyjobs.com
      - KEYCLOAK_REFRESH_TOKEN_TTL_SECONDS=86400
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1))"]
      interval: 4s
      timeout: 3s
      retries: 15
      start_period: 4s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          memory: 128M
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

  # ─── 3. Blue Stack: NestJS Core API Backend Server ────────────────
  backend_blue:
    build:
      context: ./ats_backend
      dockerfile: Dockerfile.prod
    container_name: ats_backend_blue
    volumes:
      - ./ats_backend/public/image/logos:/app/public/image/logos
    restart: always
    expose:
      - "5000"
    env_file:
      - path: ./ats_backend/.env
        required: false
    environment:
      - NODE_ENV=production
      - PORT=5000
      - NODE_OPTIONS=--dns-result-order=ipv4first
      - DATABASE_URL=postgresql://ats_user:${POSTGRES_PASSWORD:-AtsDevPass2024}@postgres:5432/ats_db?schema=ats&options=-csearch_path%3Dats,mass_mail,public
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - PYTHON_PARSER_URL=http://api:8000
      - BASE_DOMAIN=enfyjobs.com
      - FRONTEND_URL=https://enfyjobs.com
      - KEYCLOAK_ISSUER=http://keycloak:8080/realms/enfycon-ats
      - KEYCLOAK_CLIENT_ID=enfycon-ats
      - KEYCLOAK_CLIENT_SECRET=${KEYCLOAK_CLIENT_SECRET:-mL9aWPt1POtRCp2dDqCt9tG4fakwm7rn}
      - KEYCLOAK_ADMIN=${KEYCLOAK_ADMIN:-admin}
      - KEYCLOAK_ADMIN_PASSWORD=${KEYCLOAK_ADMIN_PASSWORD:-admin}
      - PLATFORM_ADMIN_EMAIL=${PLATFORM_ADMIN_EMAIL:-admin@enfycon.com}
      - PLATFORM_ADMIN_PASSWORD=${PLATFORM_ADMIN_PASSWORD:-enfycon123}
      - PLATFORM_ADMIN_NAME=${PLATFORM_ADMIN_NAME:-Enfy Super Admin}
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_started
      redis:
        condition: service_started
      api:
        condition: service_started
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:5000/api/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1))"]
      interval: 4s
      timeout: 3s
      retries: 15
      start_period: 4s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          memory: 128M
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

  # ─── 4. Green Stack: Next.js Frontend Application ─────────────────
  frontend_green:
    build:
      context: ./ats_frontend_main
      dockerfile: Dockerfile.prod
    container_name: ats_frontend_green
    restart: always
    expose:
      - "3000"
    env_file:
      - path: ./ats_frontend_main/.env
        required: false
    environment:
      - NODE_ENV=production
      - PORT=3000
      - AUTH_TRUST_HOST=true
      - INTERNAL_API_URL=http://backend_green:5000
      - NEXT_PUBLIC_API_URL=https://api.enfyjobs.com
      - NEXT_PUBLIC_MAIN_DOMAIN_URL=https://enfyjobs.com
      - KEYCLOAK_REFRESH_TOKEN_TTL_SECONDS=86400
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1))"]
      interval: 4s
      timeout: 3s
      retries: 15
      start_period: 4s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          memory: 128M
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

  # ─── 5. Green Stack: NestJS Core API Backend Server ───────────────
  backend_green:
    build:
      context: ./ats_backend
      dockerfile: Dockerfile.prod
    container_name: ats_backend_green
    volumes:
      - ./ats_backend/public/image/logos:/app/public/image/logos
    restart: always
    expose:
      - "5000"
    env_file:
      - path: ./ats_backend/.env
        required: false
    environment:
      - NODE_ENV=production
      - PORT=5000
      - NODE_OPTIONS=--dns-result-order=ipv4first
      - DATABASE_URL=postgresql://ats_user:${POSTGRES_PASSWORD:-AtsDevPass2024}@postgres:5432/ats_db?schema=ats&options=-csearch_path%3Dats,mass_mail,public
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - PYTHON_PARSER_URL=http://api:8000
      - BASE_DOMAIN=enfyjobs.com
      - FRONTEND_URL=https://enfyjobs.com
      - KEYCLOAK_ISSUER=http://keycloak:8080/realms/enfycon-ats
      - KEYCLOAK_CLIENT_ID=enfycon-ats
      - KEYCLOAK_CLIENT_SECRET=${KEYCLOAK_CLIENT_SECRET:-mL9aWPt1POtRCp2dDqCt9tG4fakwm7rn}
      - KEYCLOAK_ADMIN=${KEYCLOAK_ADMIN:-admin}
      - KEYCLOAK_ADMIN_PASSWORD=${KEYCLOAK_ADMIN_PASSWORD:-admin}
      - PLATFORM_ADMIN_EMAIL=${PLATFORM_ADMIN_EMAIL:-admin@enfycon.com}
      - PLATFORM_ADMIN_PASSWORD=${PLATFORM_ADMIN_PASSWORD:-enfycon123}
      - PLATFORM_ADMIN_NAME=${PLATFORM_ADMIN_NAME:-Enfy Super Admin}
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_started
      redis:
        condition: service_started
      api:
        condition: service_started
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:5000/api/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1))"]
      interval: 4s
      timeout: 3s
      retries: 15
      start_period: 4s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          memory: 128M
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

  # ─── 6. FastAPI Resume Parser Microservice (Shared) ───────────────
  api:
    build:
      context: ./resume-parser-main
      dockerfile: Dockerfile
    container_name: ats_parser_api
    restart: always
    expose:
      - "8000"
    env_file:
      - path: ./resume-parser-main/.env
        required: false
    environment:
      - DATABASE_URL=postgresql://ats_user:${POSTGRES_PASSWORD:-AtsDevPass2024}@postgres:5432/ats_db
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --workers 2
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1280M
        reservations:
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

  # ─── 7. Celery Background Worker (Shared) ─────────────────────────
  worker:
    build:
      context: ./resume-parser-main
      dockerfile: Dockerfile
    container_name: ats_parser_worker
    restart: always
    env_file:
      - path: ./resume-parser-main/.env
        required: false
    environment:
      - DATABASE_URL=postgresql://ats_user:${POSTGRES_PASSWORD:-AtsDevPass2024}@postgres:5432/ats_db
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    command: celery -A app.celery_app worker --loglevel=info --concurrency=2
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      api:
        condition: service_started
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 3072M
        reservations:
          memory: 1536M
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

  # ─── 8. Redis Message Broker & Queue (Shared) ─────────────────────
  redis:
    image: redis:alpine
    container_name: ats_redis
    restart: always
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 128M
        reservations:
          memory: 32M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ─── 9. Keycloak Identity Provider (Shared) ───────────────────────
  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    container_name: ats_keycloak
    restart: always
    command: start-dev
    environment:
      - KEYCLOAK_ADMIN=${KEYCLOAK_ADMIN:-admin}
      - KEYCLOAK_ADMIN_PASSWORD=${KEYCLOAK_ADMIN_PASSWORD:-admin}
      - KC_HTTP_ENABLED=true
      - KC_HOSTNAME_STRICT=false
      - KC_PROXY_HEADERS=xforwarded
      - KC_HOSTNAME=auth.enfyjobs.com
      # ── Docker PostgreSQL (keycloak schema) ──
      - KC_DB=postgres
      - KC_DB_URL=jdbc:postgresql://postgres:5432/ats_db
      - KC_DB_USERNAME=ats_user
      - KC_DB_PASSWORD=${POSTGRES_PASSWORD:-AtsDevPass2024}
      - KC_DB_SCHEMA=keycloak
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./keycloak/imports:/opt/keycloak/data/import
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1280M
        reservations:
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ─── 10. pgAdmin 4 Database Web GUI (Shared) ──────────────────────
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: ats_pgadmin
    restart: always
    environment:
      - PGADMIN_DEFAULT_EMAIL=${PGADMIN_DEFAULT_EMAIL:-admin@enfyjobs.com}
      - PGADMIN_DEFAULT_PASSWORD=${PGADMIN_DEFAULT_PASSWORD:-AtsDevPass2024}
      - PGADMIN_CONFIG_SERVER_MODE=False
      - PGADMIN_SERVER_JSON_FILE=/pgadmin4/servers.json
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./scripts/pgadmin_servers.json:/pgadmin4/servers.json:ro
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          memory: 128M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  caddy_data:
  caddy_config:
  redis_data:
  postgres_data:
  pgadmin_data:
