services:
  # ─── 1. Caddy Reverse Proxy & Automatic SSL Engine ────────────────
  caddy:
    image: caddy:2-alpine
    container_name: ats_caddy
    restart: always
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp" # HTTP/3 Support
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy_upstreams:/etc/caddy/upstreams:ro
      - caddy_data:/data
      - caddy_config:/config
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

  # ─── 2. Blue Stack: Next.js Frontend Application ──────────────────
  frontend_blue:
    build:
      context: ./ats_frontend_main
      dockerfile: Dockerfile.prod
    container_name: ats_frontend_blue
    restart: always
    expose:
      - "3000"
    env_file:
      - path: ./ats_frontend_main/.env
        required: false
    environment:
      - NODE_ENV=production
      - PORT=3000
      - AUTH_TRUST_HOST=true
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/api/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

  # ─── 3. Blue Stack: NestJS Core API Backend Server ────────────────
  backend_blue:
    build:
      context: ./ats_backend
      dockerfile: Dockerfile.prod
    container_name: ats_backend_blue
    restart: always
    expose:
      - "5000"
    env_file:
      - path: ./ats_backend/.env
        required: false
    environment:
      - NODE_ENV=production
      - PORT=5000
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - PYTHON_PARSER_URL=http://api:8000
      - BASE_DOMAIN=enfyjobs.com
      - FRONTEND_URL=https://enfyjobs.com
    depends_on:
      - redis
      - api
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:5000/api/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

  # ─── 4. Green Stack: Next.js Frontend Application ─────────────────
  frontend_green:
    build:
      context: ./ats_frontend_main
      dockerfile: Dockerfile.prod
    container_name: ats_frontend_green
    restart: always
    expose:
      - "3000"
    env_file:
      - path: ./ats_frontend_main/.env
        required: false
    environment:
      - NODE_ENV=production
      - PORT=3000
      - AUTH_TRUST_HOST=true
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/api/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

  # ─── 5. Green Stack: NestJS Core API Backend Server ───────────────
  backend_green:
    build:
      context: ./ats_backend
      dockerfile: Dockerfile.prod
    container_name: ats_backend_green
    restart: always
    expose:
      - "5000"
    env_file:
      - path: ./ats_backend/.env
        required: false
    environment:
      - NODE_ENV=production
      - PORT=5000
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - PYTHON_PARSER_URL=http://api:8000
      - BASE_DOMAIN=enfyjobs.com
      - FRONTEND_URL=https://enfyjobs.com
    depends_on:
      - redis
      - api
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:5000/api/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

  # ─── 6. FastAPI Resume Parser Microservice (Shared) ───────────────
  api:
    build:
      context: ./resume-parser-main
      dockerfile: Dockerfile
    container_name: ats_parser_api
    restart: always
    expose:
      - "8000"
    env_file:
      - path: ./resume-parser-main/.env
        required: false
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --workers 2
    depends_on:
      - redis
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

  # ─── 7. Celery Background Worker (Shared) ─────────────────────────
  worker:
    build:
      context: ./resume-parser-main
      dockerfile: Dockerfile
    container_name: ats_parser_worker
    restart: always
    env_file:
      - path: ./resume-parser-main/.env
        required: false
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    command: celery -A app.celery_app worker --loglevel=info --concurrency=2
    depends_on:
      - redis
      - api
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

  # ─── 8. Redis Message Broker & Queue (Shared) ─────────────────────
  redis:
    image: redis:alpine
    container_name: ats_redis
    restart: always
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ─── 9. Keycloak Identity Provider (Shared) ───────────────────────
  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    container_name: ats_keycloak
    restart: always
    env_file:
      - path: ./ats_backend/.env
        required: false
    command: start-dev
    volumes:
      - ./keycloak/import:/opt/keycloak/data/import
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  caddy_data:
  caddy_config:
  redis_data:
