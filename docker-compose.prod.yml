services:
  # ─── 1. Caddy Reverse Proxy & Automatic SSL Engine ────────────────
  caddy:
    image: caddy:2-alpine
    container_name: ats_caddy
    restart: always
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp" # HTTP/3 Support
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - backend
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

  # ─── 2. Next.js Frontend Application ──────────────────────────────
  frontend:
    build:
      context: ./ats_frontend_main
      dockerfile: Dockerfile.prod
    container_name: ats_frontend
    restart: always
    expose:
      - "3000"
    env_file:
      - path: ./ats_frontend_main/.env
        required: false
    environment:
      - NODE_ENV=production
      - PORT=3000
      - NEXT_PUBLIC_API_URL=https://api.enfyjobs.com
      - AUTH_SECRET=1kc7Cf4Z2V2XX0WfGLrET9iZzWyDkar9RlqjIK3Vkxo
      - NEXTAUTH_SECRET=1kc7Cf4Z2V2XX0WfGLrET9iZzWyDkar9RlqjIK3Vkxo
      - AUTH_TRUST_HOST=true
      - NEXTAUTH_URL=https://enfyjobs.com
    depends_on:
      - backend
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

  # ─── 3. NestJS Core API Backend Server ────────────────────────────
  backend:
    build:
      context: ./ats_backend
      dockerfile: Dockerfile.prod
    container_name: ats_backend
    restart: always
    expose:
      - "5000"
    env_file:
      - path: ./ats_backend/.env
        required: false
    environment:
      - NODE_ENV=production
      - PORT=5000
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - PYTHON_PARSER_URL=http://api:8000
      - BASE_DOMAIN=enfyjobs.com
      - FRONTEND_URL=https://enfyjobs.com
    depends_on:
      - redis
      - api
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

  # ─── 4. FastAPI Resume Parser Microservice ────────────────────────
  api:
    build:
      context: ./resume-parser-main
      dockerfile: Dockerfile
    container_name: ats_parser_api
    restart: always
    expose:
      - "8000"
    env_file:
      - path: ./resume-parser-main/.env
        required: false
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --workers 2
    depends_on:
      - redis
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

  # ─── 5. Celery Background Worker ──────────────────────────────────
  worker:
    build:
      context: ./resume-parser-main
      dockerfile: Dockerfile
    container_name: ats_parser_worker
    restart: always
    env_file:
      - path: ./resume-parser-main/.env
        required: false
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    command: celery -A app.celery_app worker --loglevel=info --concurrency=2
    depends_on:
      - redis
      - api
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

  # ─── 6. Redis Message Broker & Queue ──────────────────────────────
  redis:
    image: redis:alpine
    container_name: ats_redis
    restart: always
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ─── 7. Keycloak Identity Provider (Optional) ─────────────────────
  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    container_name: ats_keycloak
    restart: always
    environment:
      - KEYCLOAK_ADMIN=admin
      - KEYCLOAK_ADMIN_PASSWORD=admin
    command: start-dev
    volumes:
      - ./keycloak/import:/opt/keycloak/data/import
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  caddy_data:
  caddy_config:
  redis_data:
