services:
  # ─── 0. PostgreSQL — Single DB, 3 schemas (ats, mass_mail, keycloak) ──
  postgres:
    image: postgres:16-alpine
    container_name: ats_postgres
    restart: always
    environment:
      POSTGRES_DB: ats_db
      POSTGRES_USER: ats_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-schemas.sql:/docker-entrypoint-initdb.d/01-init-schemas.sql:ro
      - ./scripts/production_seed_data.sql:/docker-entrypoint-initdb.d/02-seed-data.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ats_user -d ats_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 768M
        reservations:
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ─── 1. Caddy Reverse Proxy & Automatic SSL Engine ────────────────
  caddy:
    image: caddy:2-alpine
    container_name: ats_caddy
    restart: always
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp" # HTTP/3 Support
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy_upstreams:/etc/caddy/upstreams:ro
      - caddy_data:/data
      - caddy_config:/config
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 128M
        reservations:
          memory: 32M
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

  # ─── 2. Blue Stack: Next.js Frontend Application ──────────────────
  frontend_blue:
    build:
      context: ./ats_frontend_main
      dockerfile: Dockerfile.prod
    container_name: ats_frontend_blue
    restart: always
    expose:
      - "3000"
    env_file:
      - path: ./ats_frontend_main/.env
        required: false
    environment:
      - NODE_ENV=production
      - PORT=3000
      - AUTH_TRUST_HOST=true
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1))"]
      interval: 4s
      timeout: 3s
      retries: 15
      start_period: 4s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          memory: 128M
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

  # ─── 3. Blue Stack: NestJS Core API Backend Server ────────────────
  backend_blue:
    build:
      context: ./ats_backend
      dockerfile: Dockerfile.prod
    container_name: ats_backend_blue
    restart: always
    expose:
      - "5000"
    env_file:
      - path: ./ats_backend/.env
        required: false
    environment:
      - NODE_ENV=production
      - PORT=5000
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - PYTHON_PARSER_URL=http://api:8000
      - BASE_DOMAIN=enfyjobs.com
      - FRONTEND_URL=https://enfyjobs.com
      - KEYCLOAK_ADMIN=admin
      - KEYCLOAK_ADMIN_PASSWORD=admin
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      api:
        condition: service_started
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:5000/api/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1))"]
      interval: 4s
      timeout: 3s
      retries: 15
      start_period: 4s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          memory: 128M
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

  # ─── 4. Green Stack: Next.js Frontend Application ─────────────────
  frontend_green:
    build:
      context: ./ats_frontend_main
      dockerfile: Dockerfile.prod
    container_name: ats_frontend_green
    restart: always
    expose:
      - "3000"
    env_file:
      - path: ./ats_frontend_main/.env
        required: false
    environment:
      - NODE_ENV=production
      - PORT=3000
      - AUTH_TRUST_HOST=true
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1))"]
      interval: 4s
      timeout: 3s
      retries: 15
      start_period: 4s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          memory: 128M
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

  # ─── 5. Green Stack: NestJS Core API Backend Server ───────────────
  backend_green:
    build:
      context: ./ats_backend
      dockerfile: Dockerfile.prod
    container_name: ats_backend_green
    restart: always
    expose:
      - "5000"
    env_file:
      - path: ./ats_backend/.env
        required: false
    environment:
      - NODE_ENV=production
      - PORT=5000
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - PYTHON_PARSER_URL=http://api:8000
      - BASE_DOMAIN=enfyjobs.com
      - FRONTEND_URL=https://enfyjobs.com
      - KEYCLOAK_ADMIN=admin
      - KEYCLOAK_ADMIN_PASSWORD=admin
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      api:
        condition: service_started
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:5000/api/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1))"]
      interval: 4s
      timeout: 3s
      retries: 15
      start_period: 4s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          memory: 128M
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

  # ─── 6. FastAPI Resume Parser Microservice (Shared) ───────────────
  api:
    build:
      context: ./resume-parser-main
      dockerfile: Dockerfile
    container_name: ats_parser_api
    restart: always
    expose:
      - "8000"
    env_file:
      - path: ./resume-parser-main/.env
        required: false
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --workers 2
    depends_on:
      - redis
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1280M
        reservations:
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

  # ─── 7. Celery Background Worker (Shared) ─────────────────────────
  worker:
    build:
      context: ./resume-parser-main
      dockerfile: Dockerfile
    container_name: ats_parser_worker
    restart: always
    env_file:
      - path: ./resume-parser-main/.env
        required: false
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    command: celery -A app.celery_app worker --loglevel=info --concurrency=2
    depends_on:
      - redis
      - api
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 3072M
        reservations:
          memory: 1536M
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

  # ─── 8. Redis Message Broker & Queue (Shared) ─────────────────────
  redis:
    image: redis:alpine
    container_name: ats_redis
    restart: always
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 128M
        reservations:
          memory: 32M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ─── 9. Keycloak Identity Provider (Shared) ───────────────────────
  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    container_name: ats_keycloak
    restart: always
    environment:
      - KEYCLOAK_ADMIN=admin
      - KEYCLOAK_ADMIN_PASSWORD=admin
      - KC_HTTP_ENABLED=true
      - KC_HOSTNAME_STRICT=false
      # ── Docker PostgreSQL (keycloak schema) ──
      - KC_DB=postgres
      - KC_DB_URL=jdbc:postgresql://postgres:5432/ats_db
      - KC_DB_USERNAME=ats_user
      - KC_DB_PASSWORD=${POSTGRES_PASSWORD}
      - KC_DB_SCHEMA=keycloak
      # JVM memory caps tailored to container limit (768M heap inside 1024M container)
      - JAVA_OPTS_APPEND=-Xms256m -Xmx768m -XX:+UseG1GC
    command: start --import-realm
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./keycloak/imports:/opt/keycloak/data/import
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1024M
        reservations:
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  caddy_data:
  caddy_config:
  redis_data:
  postgres_data:
